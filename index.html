        body {

        button, .submenu-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover, .submenu-button:hover {
            background-color: #45a049;
        }

        .submenu {
            margin-top: 10px;
            display: none; /* Hidden by default */
            padding-left: 20px;
        }

        .submenu-item {
            background-color: #8BC34A;
            margin: 5px 0;
        }

        .submenu-item:hover {
            background-color: #7cb342;
        }
        
        /* Show submenu on hover */
        .menu:hover .submenu {
            display: block;
        }
        #nebula_div_btn.nebula_image_button {
	        width: 100px !important; 
	        height: auto !important;
        }
    </style>
